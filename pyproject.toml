[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veloura-audio"
version = "0.4.0"
description = "Reusable Python audio engine with crossfade and beat-aware transition planning."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = [
    "audio",
    "crossfade",
    "ffmpeg",
    "music",
    "streaming",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
veloura = "veloura.cli:main"

[project.urls]
Homepage = "https://github.com/VelouraAudio/veloura-audio"
Repository = "https://github.com/VelouraAudio/veloura-audio"
Issues = "https://github.com/VelouraAudio/veloura-audio/issues"

[project.optional-dependencies]
stream = [
    "yt-dlp>=2026.3.17",
]
discord = [
    "discord.py>=2.3.0",
    "PyNaCl>=1.5.0",
]
all = [
    "discord.py>=2.3.0",
    "PyNaCl>=1.5.0",
    "yt-dlp>=2026.3.17",
]

[tool.setuptools.packages.find]
include = ["veloura*"]

[tool.setuptools.package-data]
veloura = ["py.typed"]
